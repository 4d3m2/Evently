server {
    listen 80;
    server_name _;
    root /app/public;

    # Real files (CSS, JS, images) are served directly; everything else goes to Symfony
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # ONLY index.php (the front controller) may be executed by PHP
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Any other .php request is refused outright
    location ~ \.php$ {
        return 404;
    }
}
