name: CI

on:
    push:
        branches: [main, 'feature/**', 'fix/**']
    pull_request:
        branches: [main]
    workflow_dispatch:

# Least privilege: the automatic GITHUB_TOKEN may only read the repository.
permissions:
    contents: read

# A newer push to the same branch cancels the older, still-running run.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Code quality
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check out the code
              uses: actions/checkout@v6

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, pdo_pgsql, zip
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Validate composer.json
              run: composer check:composer

            - name: Lint PHP, YAML and the service container
              run: composer lint

            - name: Check PHP code style
              run: composer fix:dry

            - name: Static analysis
              run: composer analyse

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - name: Install npm dependencies
              run: npm ci --ignore-scripts

            - name: Check frontend formatting
              run: npm run format:check

    tests:
        name: PHPUnit
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            APP_ENV: test
            # Throwaway credentials for a temporary container, not real secrets.
            DATABASE_URL: 'postgresql://evently:evently_ci@127.0.0.1:5432/evently?serverVersion=17&charset=utf8'
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: evently
                    POSTGRES_USER: evently
                    POSTGRES_PASSWORD: evently_ci
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U evently -d evently"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        steps:
            - name: Check out the code
              uses: actions/checkout@v6

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, pdo_pgsql, zip
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Create the test database
              run: php bin/console doctrine:database:create --env=test --if-not-exists

            - name: Run Doctrine migrations
              run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

            - name: Validate the Doctrine schema
              run: php bin/console doctrine:schema:validate --env=test

            - name: Run PHPUnit
              run: composer test

    security:
        name: Dependency audit
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check out the code
              uses: actions/checkout@v6

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  tools: composer:v2

            - name: Audit Composer dependencies
              run: composer audit --locked

            - name: Audit npm dependencies
              run: npm audit --audit-level=high
